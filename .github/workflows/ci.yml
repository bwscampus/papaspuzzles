name: CI

on:
    push:
        branches: [main, staging]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            SESSION_SECRET: ci-only-secret-not-used-in-production-0123456789
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # Production Standard OPS-1/OPS-2: fail on known high-severity vulnerabilities in shipped deps.
            - run: npm audit --omit=dev --audit-level=high
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run test
            - run: npm run build

    # Production Standard DB-2/DB-6: migrations apply cleanly on real Postgres, and the
    # least-privilege app role (app_rw / app_rw_login) can run the app's queries but no DDL.
    db:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: papaspuzzles
                ports: ['5432:5432']
                options: >-
                    --health-cmd pg_isready --health-interval 5s
                    --health-timeout 5s --health-retries 10
        env:
            MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/papaspuzzles
            APP_DATABASE_URL: postgresql://app_rw_login:ci-app-password@localhost:5432/papaspuzzles
            APP_DB_PASSWORD: ci-app-password
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run migrate
            # Second run must be a no-op (idempotent role setup).
            - run: npm run migrate
            - run: node scripts/check-app-role.mjs
